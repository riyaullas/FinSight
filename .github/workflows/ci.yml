name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests on SQLite and PostgreSQL, migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight-ci
          POSTGRES_DB: finsight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finsight -d finsight_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgresql+psycopg://finsight:finsight-ci@localhost:5432/finsight_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}
      - name: Migrations apply cleanly and match the models (PostgreSQL)
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          with create_engine(os.environ["DATABASE_URL"]).begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker Compose stack starts and serves
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Create .env with throwaway secrets
        run: sh deploy/scripts/init-env.sh
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the HTTPS proxy
        run: |
          curl -kfsS https://localhost/api/ready
          curl -kfsS -o /dev/null -w "login page: %{http_code}\n" https://localhost/login
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/docs)" = "404"
      - name: Backup script works
        run: |
          sh deploy/scripts/backup.sh
          ls -l backups/
          gunzip -t backups/*.sql.gz
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
